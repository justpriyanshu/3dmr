<div id="revisions-list-container" style="max-height: 300px; overflow-y: auto;">
    <div id="revisions-list" class="list-group">
        {% for rev in model.revisions %}
        <a href="{% url 'model' model_id=rev.model_id revision=rev.revision %}" class="list-group-item revision-item d-flex justify-content-between align-items-center{% if rev.revision == model.revision %} active{% endif %}" {% if rev.revision == model.revision %}aria-current="true"{% endif %}>
            <strong class="text-nowrap me-2">Revision {{ rev.revision }}</strong>
            <small>Uploaded by {{ rev.uploader.profile.display_name|default:"a deleted user" }} on {{ rev.upload_date|date:"c" }}</small>
        </a>
        {% endfor %}
    </div>
</div>
