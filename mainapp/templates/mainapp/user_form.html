<form action="{% url 'editprofile' %}" method="post" id="editForm">
	{% csrf_token %}
	<div class="mb-3 required">
		<label class="form-label" for="{{ form.description.id_for_label }}">{{ form.description.label }}:</label>
		{% for error in form.description.errors %}<div class="alert alert-danger" role="alert">{{ error }}</div>{% endfor %}
		{{ form.description }}
	</div>
	<button type="submit" class="btn btn-primary">Submit</button>
</form>
